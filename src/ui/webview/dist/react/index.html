<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval'; style-src 'unsafe-inline';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GhostPrompt React Webview</title>
    <style>
      @keyframes gp-spin { to { transform: rotate(360deg); } }
      #gp-boot { display: flex; align-items: center; gap: 10px; }
      #gp-spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--vscode-foreground,#cccccc); border-top-color: transparent; border-radius: 50%; animation: gp-spin 0.8s linear infinite; }
    </style>
    <script src="./assets/index.js"></script>
    <link rel="stylesheet" href="./assets/style-1rPOfPnL.css">
  </head>
  <body>
    <div id="root">
      <p id="gp-boot"><span id="gp-spinner"></span>Cargando GhostPrompt…</p>
    </div>
  </body>
</html>
