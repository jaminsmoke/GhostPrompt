<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src {{cspSource}} 'nonce-{{nonce}}'; script-src 'nonce-{{nonce}}';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{{styleUri}}" />
    <title>GhostPrompt</title>
  </head>
  <body>
    <div class="container">
      <div class="settings-strip" aria-label="Opciones rápidas">
        <div class="setting-group" data-key="suggestionModelPolicy">
          <span class="setting-label">Modelo</span>
          <button
            type="button"
            class="chip"
            data-value="nonPremiumOnly"
            aria-pressed="false"
          >
            No premium
          </button>
          <button
            type="button"
            class="chip"
            data-value="anyModel"
            aria-pressed="false"
          >
            Cualquiera
          </button>
        </div>

        <div class="setting-group" data-key="suggestionStyle">
          <span class="setting-label">Estilo</span>
          <button
            type="button"
            class="chip"
            data-value="concise"
            aria-pressed="false"
          >
            Breve
          </button>
          <button
            type="button"
            class="chip"
            data-value="balanced"
            aria-pressed="false"
          >
            Normal
          </button>
          <button
            type="button"
            class="chip"
            data-value="detailed"
            aria-pressed="false"
          >
            Extenso
          </button>
        </div>

        <div class="setting-group" data-key="contextMode">
          <span class="setting-label">Contexto</span>
          <button
            type="button"
            class="chip"
            data-value="basic"
            aria-pressed="false"
          >
            Basico
          </button>
          <button
            type="button"
            class="chip"
            data-value="project"
            aria-pressed="false"
          >
            Proyecto
          </button>
          <button
            type="button"
            class="chip"
            data-value="off"
            aria-pressed="false"
          >
            Off
          </button>
        </div>

        <button id="debug-btn" type="button" class="chip chip-debug">
          Debug: off
        </button>
      </div>
      <div class="input-stack">
        <pre id="ghost-inline" class="ghost-inline" aria-hidden="true"></pre>
        <pre
          id="ghost-measure"
          class="ghost-measure"
          aria-hidden="true"
        ></pre>
        <textarea
          id="prompt-input"
          placeholder="Escribe tu prompt…"
          rows="3"
          autofocus
          spellcheck="false"
        ></textarea>
      </div>
      <div id="status-text" class="status-text" style="display: none"></div>
      <div class="toolbar">
        <span class="hint"
          >Tab: aceptar sugerencia · Enter: enviar · Shift+Enter: nueva
          línea</span
        >
        <button id="send-btn" title="Enviar al chat de Copilot">
          Enviar ↵
        </button>
      </div>
    </div>
    <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
  </body>
</html>
